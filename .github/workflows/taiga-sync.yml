# .github/workflows/taiga-sync.yml
#
# Creates a Taiga task when a pull request opens.
#
# Unlike issue_comment, pull_request workflows run from the PR BRANCH, so
# edits to this file take effect inside the PR that changes them. You can
# test without merging to main first.

name: Taiga sync

on:
  # The main path: fires automatically when a PR is opened.
  # ready_for_review covers PRs that start as drafts.
  pull_request:
    types: [opened, reopened, ready_for_review]

  # Optional second path: re-run or override after the fact by commenting
  # `/taiga assigned_to=@bob status="Ready for test"` on the PR.
  # Note this one only ever runs from the DEFAULT BRANCH.
  issue_comment:
    types: [created]

  # Manual trigger, for testing. Adds a "Run workflow" button.
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: taiga-sync-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  sync:
    # Three ways in, each with its own condition:
    #   1. a PR opening in THIS repo (forks carry no secrets - see below)
    #   2. a /taiga comment from someone with write access
    #   3. a manual dispatch
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       startsWith(github.event.comment.body, '/taiga') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:
      # Checks out the base branch, never fork code, since this job holds
      # your Taiga password.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install --no-save js-yaml@4

      - name: Create Taiga task
        run: node .github/scripts/taiga-sync.js
        env:
          TAIGA_URL: ${{ secrets.TAIGA_URL || 'https://api.taiga.io' }}
          TAIGA_USERNAME: ${{ secrets.TAIGA_USERNAME }}
          TAIGA_PASSWORD: ${{ secrets.TAIGA_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # One script, three event shapes. GitHub expressions fall through
          # on empty, so each var picks whichever source exists.
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}

          # Directives are read from the PR description on open, or from the
          # comment body when triggered by a comment. Same parser either way.
          TRIGGER_BODY: ${{ github.event.comment.body || github.event.pull_request.body }}
          TRIGGER_AUTHOR: ${{ github.event.comment.user.login || github.event.pull_request.user.login }}

          # Empty on pull_request and workflow_dispatch; the script then
          # reacts on the PR itself instead of on a comment.
          COMMENT_ID: ${{ github.event.comment.id }}
